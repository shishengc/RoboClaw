# Head camera fixed extrinsic copied from:
# /home/ck/robot_test/parameters/head_extrinsic_params.json
#
# The source file stores T_head_pitch_camera:
#   p_head_pitch_link = T_head_pitch_camera * p_camera
#
# RuleControlTask currently assumes head/waist stay at the reset pose below while
# executing camera-frame primitives. Under that fixed-pose assumption:
#   T_exec_camera = T_base_head_pitch(reset) * T_head_pitch_camera
#
# T_base_head_pitch(reset) is computed with CoRobot/Pinocchio FK
# (corobot.utils.kinematics.Kinematics.compute_head_fk). Do not regenerate this
# matrix with the hand-written FK from robot_test/head_eye_calibration.py; that
# path uses a different frame convention and flips the camera depth axis.
#
# This means AprilTag camera-frame positions can be converted to base_link by:
#   p_base_link = T_exec_camera * p_camera
extrinsics:
  source: /home/ck/robot_test/parameters/head_extrinsic_params.json
  source_transform: T_head_pitch_camera
  source_parent_frame: head_pitch_link
  source_child_frame: head_camera_optical
  fixed_robot_pose_for_T_exec_camera:
    # target_head_positions: [head_yaw_rad, head_pitch_rad]
    target_head_positions: [0.0, 0.43633230555555524]
    # target_waist_positions: [waist_pitch_rad, waist_lift_m]
    target_waist_positions: [0.8901176920412174, 0.4598677062988281]
  T_head_pitch_camera:
    - [0.01154905419417851, 0.03633581308553096, -0.9992728996798792, -0.09309730346114839]
    - [-0.010873071465479051, -0.999275902324378, -0.03646158733116647, 0.03977041211949885]
    - [-0.9998741899179753, 0.01128626249982923, -0.011145609658446354, -0.01592936593693035]
    - [0.0, 0.0, 0.0, 1.0]

# Pre-composed transform for fixed reset head/waist pose:
#   p_exec = T_exec_camera * p_camera
T_exec_camera:
  - [-0.013334748, -0.978382107, 0.206374993, 0.613127464]
  - [-0.999874275, 0.011276128, -0.011148197, -0.015927399]
  - [0.008580085, -0.206497705, -0.978409464, 1.003947753]
  - [0.0, 0.0, 0.0, 1.0]

camera_approach_axis: [0.0, 0.0, -1.0]
camera_lift_axis: [0.0, -1.0, 0.0]
camera_place_down_axis: [0.0, 1.0, 0.0]
