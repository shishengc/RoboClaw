# RuleControlTask configuration.
#
# RuleControlTask lives in corobot.policy_tasks and delegates camera calibration,
# AprilTag perception, and 30Hz action construction to mcp_control_demo.

calibration_path: /home/ck/RoboClaw/src/mcp_control_demo/config/mcp_control_calibration.yaml

perception:
  camera_name: head
  camera_frame: head_camera_optical
  tag_family: tag25h9
  tag_size_m: 0.019
  stale_after_s: 1.0

reset_on_initialize: true
reset_pose:
  # These fixed head/waist reset values must match
  # src/mcp_control_demo/config/mcp_control_calibration.yaml:
  #   extrinsics.fixed_robot_pose_for_T_exec_camera
  #
  # The configured T_exec_camera is pre-composed for this pose:
  #   T_base_camera = T_base_head_pitch(reset) * T_head_pitch_camera
  target_grippers_positions: [0.0, 0.0]
  # [head_yaw_rad, head_pitch_rad]
  target_head_positions: [0.0, 0.43633230555555524]
  # [waist_pitch_rad, waist_lift_m]
  target_waist_positions: [0.8901176920412174, 0.4598677062988281]

environment:
  dataloader:
    data_source:
      ALIGNED_ROBOT:
        enabled: true
    enabled_streams:
      camera:
        head: true
        hand_left: true
        hand_right: true
        head_depth: false
        hand_left_depth: false
        hand_right_depth: false

  motion_controller:
    enabled: true
    execution_timeout_s: 2.0

logging:
  level: INFO
